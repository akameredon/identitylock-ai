<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Verify your purchase — IdentityLock AI</title><link rel="stylesheet" href="/styles.css"></head><body><main class="buy" style="min-height:100vh;display:grid;place-items:center"><div class="pricecard"><p class="eyebrow">IDENTITYLOCK AI</p><h2 style="font-family:Georgia">Confirming your payment</h2><p id="message">Please wait while we verify your transaction securely with Paystack.</p><a id="download" class="primary" style="display:none" href="#">Download your bundle →</a><p><a href="/">Return to IdentityLock AI</a></p></div></main><script>const el=document.getElementById('message'),btn=document.getElementById('download'),ref=new URLSearchParams(location.search).get('reference');if(!ref){el.textContent='No payment reference was supplied. If you completed payment, contact support with your receipt.'}else fetch('/api/verify?reference='+encodeURIComponent(ref)).then(async r=>{const d=await r.json();if(!r.ok||!d.paid)throw new Error(d.error||'Payment could not be verified.');el.textContent='Payment verified. Your IdentityLock AI bundle is ready.';btn.href=d.download_url;btn.style.display='inline-block'}).catch(e=>{el.textContent=e.message+' You can refresh this page or contact support if you were charged.'});</script></body></html>
